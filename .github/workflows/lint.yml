name: Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    # Los PR desde un fork reciben un GITHUB_TOKEN de solo lectura: el push fallaria.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Sin esto checkout deja HEAD detached sobre el merge commit y no hay
          # branch al que commitear de vuelta.
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Fix and format
        run: |
          ruff check --fix .
          ruff format .

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nada que formatear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: ruff format"
          git push

      - name: Report remaining issues
        # Informativo: los errores que ruff no puede arreglar solo no bloquean el merge.
        continue-on-error: true
        run: ruff check --output-format=github .
